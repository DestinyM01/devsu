apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-devops-python
  namespace: demo-devops
  labels:
    app.kubernetes.io/name: demo-devops-python
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Production TLS (uncomment when cert-manager is configured):
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  rules:
    # Replace with your actual domain
    - host: demo-devops.andujaronline.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-devops-python
                port:
                  number: 80
  # Uncomment for TLS:
  # tls:
  #   - hosts:
  #       - demo-devops.yourdomain.com
  #     secretName: demo-devops-tls
